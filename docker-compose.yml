# Dev stack: `uv run python scripts/init_env.py && docker compose up -d --build`
# Ports bind to 127.0.0.1 only; nothing is exposed beyond the host.
name: finops

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql://app:${FINOPS_APP_PASSWORD:?run scripts/init_env.py first}@db:5432/${FINOPS_DB:-finops}
  WORKER_DATABASE_URL: postgresql://worker:${FINOPS_WORKER_PASSWORD:?run scripts/init_env.py first}@db:5432/${FINOPS_DB:-finops}
  MIGRATOR_DATABASE_URL: postgresql://migrator:${FINOPS_MIGRATOR_PASSWORD:?run scripts/init_env.py first}@db:5432/${FINOPS_DB:-finops}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?run scripts/init_env.py first}
  JWT_KEY_ID: ${JWT_KEY_ID:-k1}
  JWT_PREVIOUS_PUBLIC_KEYS: ${JWT_PREVIOUS_PUBLIC_KEYS:-}
  JWT_ISSUER: ${JWT_ISSUER:-finops-gateway}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-finops}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  SIGNUP_MODE: ${SIGNUP_MODE:-bootstrap}
  PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-4}
  MOCK_LLM_API_KEY: ${MOCK_LLM_API_KEY:-dev-mock-key}
  MASTER_KEY: ${MASTER_KEY:?run scripts/init_env.py first}
  MASTER_KEY_ID: ${MASTER_KEY_ID:-m1}
  MASTER_PREVIOUS_KEYS: ${MASTER_PREVIOUS_KEYS:-}
  PROVIDER_ADAPTER_DEFAULT: ${PROVIDER_ADAPTER_DEFAULT:-native}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  JANITOR_INTERVAL_SECONDS: ${JANITOR_INTERVAL_SECONDS:-30}
  RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-300}
  OUTBOX_INTERVAL_SECONDS: ${OUTBOX_INTERVAL_SECONDS:-5}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-1.0}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  # uvicorn trusts X-Forwarded-For only from these addresses (set it to your proxy's).
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

services:
  db:
    build: infra/docker/postgres
    image: finops-postgres:19rc1
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init_env.py first}
      FINOPS_DB: ${FINOPS_DB:-finops}
      FINOPS_MIGRATOR_PASSWORD: ${FINOPS_MIGRATOR_PASSWORD:?run scripts/init_env.py first}
      FINOPS_APP_PASSWORD: ${FINOPS_APP_PASSWORD:?run scripts/init_env.py first}
      FINOPS_WORKER_PASSWORD: ${FINOPS_WORKER_PASSWORD:?run scripts/init_env.py first}
      FINOPS_READONLY_PASSWORD: ${FINOPS_READONLY_PASSWORD:?run scripts/init_env.py first}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_partman_bgw
      - -c
      - pg_partman_bgw.dbname=${FINOPS_DB:-finops}
      - -c
      - pg_partman_bgw.role=migrator
      - -c
      - pg_partman_bgw.interval=3600
      - -c
      - max_connections=300
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${FINOPS_DB:-finops}"]
      interval: 5s
      timeout: 3s
      retries: 30

  mock-llm:
    build:
      context: .
      dockerfile: sidecars/mock_llm/Dockerfile
    image: finops-mock-llm:dev
    environment:
      MOCK_LATENCY_MS_MIN: ${MOCK_LATENCY_MS_MIN:-20}
      MOCK_LATENCY_MS_MAX: ${MOCK_LATENCY_MS_MAX:-80}
      MOCK_STREAM_CHUNK_DELAY_MS: ${MOCK_STREAM_CHUNK_DELAY_MS:-2}

  migrate:
    build:
      context: .
      dockerfile: infra/docker/gateway/Dockerfile
    image: finops-gateway:dev
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  gateway:
    image: finops-gateway:dev
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-llm:
        condition: service_started
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"

  # Dashboard (React 19) served by unprivileged nginx with a strict CSP; /v1 is proxied to the
  # gateway on the same origin, so no CORS is needed.
  web:
    build:
      context: web
    image: finops-web:dev
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"

  # Budget janitor (US-10): returns holds of crashed requests, rebuilds counters from the
  # ledger, purges old idempotency keys. Healthy while its heartbeat file stays fresh.
  worker:
    image: finops-gateway:dev
    command: ["python", "-m", "worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/finops-worker.alive'; sys.exit(not os.path.exists(p) or time.time() - os.path.getmtime(p) > 180)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  pgdata:
