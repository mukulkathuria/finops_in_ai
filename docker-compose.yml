# Dev stack: `uv run python scripts/init_env.py && docker compose up -d --build`
# Ports bind to 127.0.0.1 only; nothing is exposed beyond the host.
name: finops

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql://app:${FINOPS_APP_PASSWORD:?run scripts/init_env.py first}@db:5432/${FINOPS_DB:-finops}
  WORKER_DATABASE_URL: postgresql://worker:${FINOPS_WORKER_PASSWORD:?run scripts/init_env.py first}@db:5432/${FINOPS_DB:-finops}
  MIGRATOR_DATABASE_URL: postgresql://migrator:${FINOPS_MIGRATOR_PASSWORD:?run scripts/init_env.py first}@db:5432/${FINOPS_DB:-finops}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?run scripts/init_env.py first}
  JWT_KEY_ID: ${JWT_KEY_ID:-k1}
  JWT_PREVIOUS_PUBLIC_KEYS: ${JWT_PREVIOUS_PUBLIC_KEYS:-}
  JWT_ISSUER: ${JWT_ISSUER:-finops-gateway}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-finops}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  SIGNUP_MODE: ${SIGNUP_MODE:-bootstrap}
  PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-4}
  MOCK_LLM_API_KEY: ${MOCK_LLM_API_KEY:-dev-mock-key}
  MASTER_KEY: ${MASTER_KEY:?run scripts/init_env.py first}
  MASTER_KEY_ID: ${MASTER_KEY_ID:-m1}
  MASTER_PREVIOUS_KEYS: ${MASTER_PREVIOUS_KEYS:-}
  PROVIDER_ADAPTER_DEFAULT: ${PROVIDER_ADAPTER_DEFAULT:-native}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  JANITOR_INTERVAL_SECONDS: ${JANITOR_INTERVAL_SECONDS:-30}
  RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-300}
  OUTBOX_INTERVAL_SECONDS: ${OUTBOX_INTERVAL_SECONDS:-5}
  PRICE_SYNC_SOURCE: ${PRICE_SYNC_SOURCE-config/prices.json}
  PRICE_SYNC_INTERVAL_SECONDS: ${PRICE_SYNC_INTERVAL_SECONDS:-3600}
  CACHE_JANITOR_INTERVAL_SECONDS: ${CACHE_JANITOR_INTERVAL_SECONDS:-300}
  CACHE_MAX_ENTRIES_PER_ORG: ${CACHE_MAX_ENTRIES_PER_ORG:-50000}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-1.0}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  # Classifier: the dev stack answers with the mock provider's SystemOne stand-in. For the real
  # Laya model run `laya-serve` (pip install "laya[serve]", port 8000) and point LAYA_BASE_URL at it.
  CLASSIFIER_BACKEND: ${CLASSIFIER_BACKEND:-laya}
  LAYA_BASE_URL: ${LAYA_BASE_URL:-http://mock-llm:8000}
  LAYA_API_KEY: ${LAYA_API_KEY:-}
  JEV_API_KEY: ${JEV_API_KEY:-}
  JEV_BASE_URL: ${JEV_BASE_URL:-https://routellm.abacus.ai}
  JEV_MODEL: ${JEV_MODEL:-jev-latest}
  CLASSIFIER_TIMEOUT_MS: ${CLASSIFIER_TIMEOUT_MS:-2000}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  MAX_FILE_PAGES: ${MAX_FILE_PAGES:-500}
  MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-50000000}
  FILE_CHECK_TIMEOUT_S: ${FILE_CHECK_TIMEOUT_S:-15}
  OBJECT_STORE_PATH: /var/lib/finops/objects
  CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
  OCR_BACKEND: ${OCR_BACKEND:-glm_ocr}
  OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-0.80}
  GLM_OCR_BASE_URL: ${GLM_OCR_BASE_URL:-http://docparse:8000/v1}
  GLM_OCR_MODEL: ${GLM_OCR_MODEL:-zai-org/GLM-OCR}
  PADDLEOCR_VL_BASE_URL: ${PADDLEOCR_VL_BASE_URL:-http://docparse:8000/v1}
  PADDLEOCR_VL_MODEL: ${PADDLEOCR_VL_MODEL:-PaddleOCR-VL-1.5-0.9B}
  PARSER_BASE_URL: ${PARSER_BASE_URL:-http://docparse:8000/v1}
  PARSE_TIMEOUT_S: ${PARSE_TIMEOUT_S:-600}
  EMBEDDER_BASE_URL: ${EMBEDDER_BASE_URL:-http://mock-llm:8000/v1}
  EMBEDDER_MODEL: ${EMBEDDER_MODEL:-bge-m3}
  EMBEDDER_API_KEY: ${EMBEDDER_API_KEY:-dev-only}
  EMBEDDER_TIMEOUT_S: ${EMBEDDER_TIMEOUT_S:-30}
  RERANKER_BASE_URL: ${RERANKER_BASE_URL-http://mock-llm:8000/v1}
  RERANKER_MODEL: ${RERANKER_MODEL:-bge-reranker-v2-m3}
  RERANKER_API_KEY: ${RERANKER_API_KEY:-dev-only}
  RERANKER_TIMEOUT_S: ${RERANKER_TIMEOUT_S:-10}
  # uvicorn trusts X-Forwarded-For only from these addresses (set it to your proxy's).
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

services:
  db:
    build: infra/docker/postgres
    image: finops-postgres:19rc1
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init_env.py first}
      FINOPS_DB: ${FINOPS_DB:-finops}
      FINOPS_MIGRATOR_PASSWORD: ${FINOPS_MIGRATOR_PASSWORD:?run scripts/init_env.py first}
      FINOPS_APP_PASSWORD: ${FINOPS_APP_PASSWORD:?run scripts/init_env.py first}
      FINOPS_WORKER_PASSWORD: ${FINOPS_WORKER_PASSWORD:?run scripts/init_env.py first}
      FINOPS_READONLY_PASSWORD: ${FINOPS_READONLY_PASSWORD:?run scripts/init_env.py first}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_partman_bgw
      - -c
      - pg_partman_bgw.dbname=${FINOPS_DB:-finops}
      - -c
      - pg_partman_bgw.role=migrator
      - -c
      - pg_partman_bgw.interval=3600
      - -c
      - max_connections=300
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${FINOPS_DB:-finops}"]
      interval: 5s
      timeout: 3s
      retries: 30

  mock-llm:
    build:
      context: .
      dockerfile: sidecars/mock_llm/Dockerfile
    image: finops-mock-llm:dev
    environment:
      MOCK_LATENCY_MS_MIN: ${MOCK_LATENCY_MS_MIN:-20}
      MOCK_LATENCY_MS_MAX: ${MOCK_LATENCY_MS_MAX:-80}
      MOCK_STREAM_CHUNK_DELAY_MS: ${MOCK_STREAM_CHUNK_DELAY_MS:-2}
      MOCK_EMBED_LATENCY_MS: ${MOCK_EMBED_LATENCY_MS:-10}

  # Document parsing (US-15, US-16): MarkItDown, PDF text layers, and OCR through an
  # OpenAI-compatible vision model (the mock provider here; vLLM serving GLM-OCR or
  # PaddleOCR-VL in production, one sidecar per backend).
  docparse:
    build:
      context: .
      dockerfile: sidecars/docparse/Dockerfile
    image: finops-docparse:dev
    environment:
      DOCPARSE_VLM_BASE_URL: ${DOCPARSE_VLM_BASE_URL:-http://mock-llm:8000/v1}
      DOCPARSE_VLM_API_KEY: ${DOCPARSE_VLM_API_KEY:-dev-only}
    depends_on:
      mock-llm:
        condition: service_started

  migrate:
    build:
      context: .
      dockerfile: infra/docker/gateway/Dockerfile
    image: finops-gateway:dev
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  gateway:
    image: finops-gateway:dev
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1} # uvicorn worker processes
    volumes:
      - objects:/var/lib/finops/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-llm:
        condition: service_started
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"

  # Dashboard (React 19) served by unprivileged nginx with a strict CSP; /v1 is proxied to the
  # gateway on the same origin, so no CORS is needed.
  web:
    build:
      context: web
    image: finops-web:dev
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"

  # Budget janitor (US-10): returns holds of crashed requests, rebuilds counters from the
  # ledger, purges old idempotency keys. Healthy while its heartbeat file stays fresh.
  worker:
    image: finops-gateway:dev
    command: ["python", "-m", "worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/finops-worker.alive'; sys.exit(not os.path.exists(p) or time.time() - os.path.getmtime(p) > 180)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  pgdata:
  objects:
