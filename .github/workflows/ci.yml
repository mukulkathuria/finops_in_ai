# CI gates (spec section 11): every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.14"

jobs:
  static:
    name: lint, types, import contracts, route audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/audit_routes.py

  tests:
    name: unit, contract and integration tests on PostgreSQL 19
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: ci-superuser-pw
      FINOPS_MIGRATOR_PASSWORD: ci-migrator-pw
      FINOPS_APP_PASSWORD: ci-app-pw
      FINOPS_WORKER_PASSWORD: ci-worker-pw
      FINOPS_READONLY_PASSWORD: ci-readonly-pw
      TEST_DATABASE_URL: postgresql://postgres:ci-superuser-pw@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - name: Start PostgreSQL 19 (pinned RC image + pgvector + pg_partman)
        run: |
          docker build -t finops-postgres:ci infra/docker/postgres
          docker run -d --name pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD -e FINOPS_MIGRATOR_PASSWORD -e FINOPS_APP_PASSWORD \
            -e FINOPS_WORKER_PASSWORD -e FINOPS_READONLY_PASSWORD finops-postgres:ci
          for i in $(seq 1 60); do
            docker exec pg pg_isready -U postgres -d finops && break
            sleep 2
          done
          docker exec pg pg_isready -U postgres -d finops
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Migrations apply from empty, then the RLS coverage audit
        env:
          MIGRATOR_DATABASE_URL: postgresql://migrator:ci-migrator-pw@127.0.0.1:5432/finops
          AUDIT_DATABASE_URL: postgresql://migrator:ci-migrator-pw@127.0.0.1:5432/finops
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run python scripts/audit_rls.py

  security:
    name: SAST, dependency and secret scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - name: Bandit
        run: uv run bandit -q -c pyproject.toml -r gateway control_plane worker
      - name: pip-audit (locked runtime dependencies)
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uv run pip-audit --strict --disable-pip -r /tmp/requirements.txt
      - name: Gitleaks (whole history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --exit-code 1 --gitleaks-ignore-path /repo/.gitleaksignore
      - name: Semgrep (custom rules + Python ruleset)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.183.0 \
            semgrep scan --error --metrics=off --config .semgrep/rules.yml --config p/python \
            gateway control_plane worker scripts sidecars

  web:
    name: dashboard types, tests, audit and build
    runs-on: ubuntu-24.04
    container: node:24-bookworm-slim
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build

  image:
    name: build and scan the gateway image
    runs-on: ubuntu-24.04
    needs: [static]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f infra/docker/gateway/Dockerfile -t finops-gateway:ci .
      - name: Trivy (fail on fixable HIGH and CRITICAL; path-scoped secret exceptions)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-secret.yaml:/trivy-secret.yaml:ro" aquasec/trivy:0.76.1 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --secret-config /trivy-secret.yaml finops-gateway:ci
