[project]
name = "finops-gateway"
version = "0.1.0"
description = "AI FinOps Gateway: an OpenAI-compatible, multi-provider AI control plane with budgets, guardrails and savings accounting."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "FinOps Gateway maintainers" }]
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx2>=2.16",
    "orjson>=3.13",
    "sqlalchemy[asyncio]>=2.1.6",
    "psycopg[binary]>=3.3.7",
    "alembic>=1.20",
    "pyyaml>=6.0.3",
    "prometheus-client>=0.26",
    "argon2-cffi>=25.1",
    "pyjwt[crypto]>=2.15",
    "cryptography>=50",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.0",
    "hypothesis>=6.170",
    "ruff>=0.17",
    "mypy>=2.4",
    "import-linter>=2.15",
    "types-PyYAML>=6.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "control_plane", "worker"]

[tool.uv]
required-version = ">=0.8"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["web", "sidecars/*/models", "infra"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PT", "C4",
    "DTZ", "T20", "BLE", "PIE", "RET", "PERF", "N", "LOG", "G",
]
ignore = [
    "S101",   # asserts are fine outside of hot paths; tests rely on them
    "RET504", # readability over terseness for named results
    "N818",   # domain errors read as outcomes (Forbidden, NotFound), not as *Error classes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "PERF", "N802"]
"scripts/**" = ["T20"]
"migrations/**" = ["E501", "S608"]  # static DDL; seed values are module constants

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
packages = ["gateway", "control_plane", "worker"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "valkey.*", "argon2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sidecars"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs a real PostgreSQL 19 (TEST_DATABASE_URL)",
    "contract: adapter contract suites against recorded fixtures",
    "slow: long-running (load, race, soak)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
branch = true
source = ["gateway", "control_plane", "worker"]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "^ *[.][.][.] *$"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["gateway", "control_plane", "worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure: no I/O frameworks, adapters or wiring"
type = "forbidden"
source_modules = ["gateway.domain"]
forbidden_modules = [
    "gateway.adapters", "gateway.app", "gateway.api", "gateway.pipeline", "control_plane", "worker",
    "sqlalchemy", "psycopg", "httpx2", "fastapi", "starlette", "valkey",
]

[[tool.importlinter.contracts]]
name = "Ports depend only on the domain"
type = "forbidden"
source_modules = ["gateway.ports"]
forbidden_modules = [
    "gateway.adapters", "gateway.app", "gateway.api", "gateway.pipeline", "control_plane", "worker",
    "sqlalchemy", "psycopg", "httpx2", "fastapi", "starlette",
]

[[tool.importlinter.contracts]]
name = "Data plane never imports the control plane or worker"
type = "forbidden"
source_modules = ["gateway.domain", "gateway.ports", "gateway.adapters", "gateway.pipeline", "gateway.api"]
forbidden_modules = ["control_plane", "worker"]

[[tool.importlinter.contracts]]
name = "Only the composition root wires the control plane"
type = "forbidden"
source_modules = ["control_plane", "worker"]
forbidden_modules = ["gateway.app.main"]

[tool.bandit]
exclude_dirs = ["tests"]
