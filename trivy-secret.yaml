# Trivy secret-scanning exceptions for the image scan (CI job "build and scan the gateway image").
# Every entry is scoped to a third-party path and says why its matches are not secrets. Never
# allow a rule or a content pattern everywhere: a real leaked key elsewhere must still fail.
# Vulnerability scanning of these packages is unaffected (it reads package metadata).
allow-rules:
  - id: anthropic-sdk-docstrings
    description: >-
      The Anthropic SDK's docstrings (beta agents and sessions) quote the shape of a
      service-account principal, a JSON object with "type": "service_account". They hold no
      credential; the published package is third-party code we do not author.
    path: .*/site-packages/anthropic/.*
